function scrollBottom(){threadWrap.scrollTop=threadWrap.scrollHeight}
var AI_ENDPOINT='https://insovider-proxy.gfdgdfghfghghf.workers.dev/';
var pending=false;
function thoughtText(q){return 'Sent context to Sonnet 4.6 and drafted the answer.'}
function toApiMessages(msgs){
var out=[];var budget=200*1024;
msgs.slice(-20).forEach(function(m){
if(m.role!=='user'){if(m.role==='ai'&&m.text)out.push({role:'assistant',content:m.text});return}
var t=m.text;
if(m.files&&m.files.length)t+='\n[Attached files: '+m.files.join(', ')+']';
if(m._texts&&m._texts.length){
m._texts.forEach(function(tf){
var chunk='\n\n[Contents of '+tf.name+']:\n'+tf.text;
if(chunk.length>budget)chunk=chunk.slice(0,Math.max(0,budget))+'\n[file truncated for length]';
budget=Math.max(0,budget-chunk.length);
t+=chunk;
});
}
if(m._images&&m._images.length){
var parts=[{type:'text',text:t}];
m._images.forEach(function(im){parts.push({type:'image_url',image_url:{url:im.url}})});
out.push({role:'user',content:parts});
}else{out.push({role:'user',content:t})}
});
return out;
}
var DEFAULT_MODEL='anthropic/claude-sonnet-4-6';
var MODELS={'anthropic/claude-sonnet-4-6':'Sonnet 4.6','minimax-m3':'Minimax M3'};
function modelLabel(id){return MODELS[id]||'Sonnet 4.6'}
function callAI(msgs,mid){
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},90000);
return fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:mid,messages:toApiMessages(msgs)}),signal:ctrl.signal}).then(function(res){
clearTimeout(to);
if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+(t?' — '+t.slice(0,180):''))});
return res.json();
}).then(function(data){
if(data&&typeof data.reply==='string'&&data.reply.trim())return {text:data.reply.trim(),search:(data.search&&data.search.results&&data.search.results.length)?data.search:null};
var ch=data&&data.choices&&data.choices[0];
var txt=ch&&((ch.message&&ch.message.content)||ch.text||'');
txt=String(txt==null?'':txt).trim();
if(!txt)throw new Error('Empty reply from model.');
return {text:txt,search:null};
}).catch(function(err){clearTimeout(to);if(err&&err.name==='AbortError')throw new Error('Timed out.');throw err});
}

function searchCard(s){
var sc=document.createElement('div');sc.className='search-card';
var q=document.createElement('div');q.className='search-q';
q.innerHTML='<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
var lab=document.createElement('span');lab.textContent='Searched the web for ';
var b=document.createElement('b');b.textContent=s.query||'';
q.appendChild(lab);q.appendChild(b);sc.appendChild(q);
var chips=document.createElement('div');chips.className='search-src';
s.results.forEach(function(r){
var a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';
var host='';try{host=new URL(r.url).hostname}catch(e){}
if(host){var im=document.createElement('img');im.alt='';im.src='https://www.google.com/s2/favicons?domain='+host+'&sz=64';im.onerror=function(){im.remove()};a.appendChild(im)}
var t=document.createElement('span');t.textContent=r.title||host||r.url;a.appendChild(t);
chips.appendChild(a);
});
sc.appendChild(chips);
return sc;
}
function renderRich(el,text){
text=String(text==null?'':text);
if(text.indexOf('```')===-1){el.textContent=text;return}
el.innerHTML='';
var re=/```([a-zA-Z0-9+#-]*)\n?([\s\S]*?)(?:```|$)/g;
var last=0,m;
function addPara(t){t=t.replace(/^\n+|\s+$/g,'');if(!t)return;var d=document.createElement('div');d.className='ai-p';d.textContent=t;el.appendChild(d)}
while((m=re.exec(text))!==null){
addPara(text.slice(last,m.index));
var lang=(m[1]||'code').toLowerCase();
var code=m[2].replace(/\n+$/g,'');
var box=document.createElement('div');box.className='codeblock';
var head=document.createElement('div');head.className='code-head';
var lg=document.createElement('span');lg.textContent=lang;head.appendChild(lg);
var cb=document.createElement('button');cb.type='button';cb.className='code-copy';cb.textContent='Copy';cb.setAttribute('aria-label','Copy code block');
cb.addEventListener('click',function(){
var done=function(){cb.textContent='Copied';setTimeout(function(){cb.textContent='Copy'},1200)};
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,done)}else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}}catch(e){done()}
});
head.appendChild(cb);box.appendChild(head);
var pre=document.createElement('pre');var cd=document.createElement('code');cd.textContent=code;pre.appendChild(cd);box.appendChild(pre);
el.appendChild(box);
last=m.index+m[0].length;
}
addPara(text.slice(last));
}
function aiNode(m){
var wrap=document.createElement('div');wrap.className='msg ai';
if(m.search&&m.search.results&&m.search.results.length){wrap.appendChild(searchCard(m.search))}
var th=document.createElement('button');th.type='button';th.className='thought';th.setAttribute('aria-expanded','false');
th.innerHTML='<svg class="t-ic" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3l2 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>Thought Process</span><svg class="chev" viewBox="0 0 8 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 1l4 5-4 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var tb=document.createElement('div');tb.className='thought-body';tb.textContent=m.thought||thoughtText(m.text||'');
th.addEventListener('click',function(){var open=th.classList.toggle('open');th.setAttribute('aria-expanded',open?'true':'false')});
var body=document.createElement('div');body.className='ai-text';renderRich(body,m.text);
var acts=document.createElement('div');acts.className='msg-actions';
var copy=document.createElement('button');copy.type='button';copy.className='icon-btn';copy.setAttribute('aria-label','Copy response');
var copySvg='<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 3.5v-1h-7v7h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
var okSvg='<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
copy.innerHTML=copySvg;
copy.addEventListener('click',function(){
var done=function(){copy.innerHTML=okSvg;setTimeout(function(){copy.innerHTML=copySvg},1200)};
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(m.text).then(done,done)}else{var ta=document.createElement('textarea');ta.value=m.text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}}catch(e){done()}
});
acts.appendChild(copy);
wrap.appendChild(th);wrap.appendChild(tb);wrap.appendChild(body);wrap.appendChild(acts);
return wrap;
}
function filePills(names){var fa=document.createElement('div');fa.className='f-a';names.forEach(function(n){var s=document.createElement('span');s.textContent=n;s.title=n;fa.appendChild(s)});return fa}
function userNode(m){
var wrap=document.createElement('div');wrap.className='msg user';
var col=document.createElement('div');col.className='u-col';
var b=document.createElement('div');b.className='bubble';b.textContent=m.text;
col.appendChild(b);
if(m._images&&m._images.length){
var imw=document.createElement('div');imw.className='u-imgs';var have={};
m._images.forEach(function(im){have[im.name]=1;var el=document.createElement('img');el.src=im.url;el.alt=im.name;imw.appendChild(el)});
col.appendChild(imw);
var rest=(m.files||[]).filter(function(n){return !have[n]});
if(rest.length)col.appendChild(filePills(rest));
}
else if(m.files&&m.files.length){col.appendChild(filePills(m.files))}
wrap.appendChild(col);
return wrap;
}

function readImage(file){
return new Promise(function(resolve){
if(!file.type||file.type.indexOf('image/')!==0)return resolve(null);
var url=URL.createObjectURL(file);
var img=new Image();
img.onload=function(){
try{
var max=1568;var s=Math.min(1,max/Math.max(img.width||1,img.height||1));
var cw=Math.max(1,Math.round((img.width||1)*s)),ch=Math.max(1,Math.round((img.height||1)*s));
var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
cv.getContext('2d').drawImage(img,0,0,cw,ch);
URL.revokeObjectURL(url);
resolve(cv.toDataURL('image/jpeg',0.85));
}catch(e){URL.revokeObjectURL(url);resolve(null)}
};
img.onerror=function(){URL.revokeObjectURL(url);resolve(null)};
img.src=url;
});
}
chipFile.addEventListener('click',function(){fileInput.click()});
var TEXT_EXT=/\.(txt|md|markdown|js|jsx|ts|tsx|json|csv|tsv|html|htm|css|scss|xml|yml|yaml|toml|py|java|c|cpp|h|hpp|cs|go|rs|php|rb|swift|kt|sql|sh|log|ini|cfg|env|vue|svelte|gitignore)$/i;
var TEXT_MIME=/^(text\/|application\/(json|javascript|x-javascript|xml|x-yaml|yaml|toml)|.*\+json$|.*\+xml$)/i;
function isTextFile(f){if(f.type&&TEXT_MIME.test(f.type))return true;return TEXT_EXT.test(f.name||'')}
function readTextFile(file){
return new Promise(function(resolve){
if(file.size>2*1024*1024)return resolve(null);
var r=new FileReader();
r.onload=function(){try{var t=String(r.result||'');if(t.length>100*1024)t=t.slice(0,100*1024)+'\n[truncated: file too long]';resolve(t)}catch(e){resolve(null)}};
r.onerror=function(){resolve(null)};
try{r.readAsText(file)}catch(e){resolve(null)}
});
}
fileInput.addEventListener('change',function(){
var picked=Array.prototype.slice.call(fileInput.files);fileInput.value='';
Promise.all(picked.map(function(f){
if(f.type&&f.type.indexOf('image/')===0)return readImage(f).then(function(u){return {f:f,url:u,text:null}});
if(isTextFile(f))return readTextFile(f).then(function(t){return {f:f,url:null,text:t}});
return Promise.resolve({f:f,url:null,text:null});
})).then(function(items){items.forEach(function(it){files.push(it)});renderFiles();prompt.focus()});
prompt.focus();
});
prompt.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();form.requestSubmit()}});
var BLOCKED=/\b(cp|childporn|porn|nigga|nigger)\b/i;
function isBlocked(s){return BLOCKED.test(s||'')}
function blockNotice(){
enterChat();
var n=document.createElement('div');n.className='msg sys';
var b=document.createElement('div');b.className='sys-bubble';b.textContent='That message was blocked. Please try to rephrase the message.';
n.appendChild(b);thread.appendChild(n);scrollBottom();
var card=document.getElementById('composer');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
}
form.addEventListener('submit',function(e){
e.preventDefault();
var text=prompt.value.trim();
if(!text&&!files.length){prompt.focus();return}
if(isBlocked(text)||files.some(function(it){return isBlocked(it.f.name)||(it.text&&isBlocked(it.text))})){blockNotice();prompt.focus();return}
var c=cur();
if(!c){var id=uid();c={id:id,title:'New chat',customTitle:false,messages:[],updatedAt:Date.now()};store.chats[id]=c;store.order.push(id);store.activeId=id}
var fns=files.map(function(it){return it.f.name});
var um={role:'user',text:text||('Sent '+fns.length+' file'+(fns.length>1?'s':''))};if(fns.length)um.files=fns;
var imgs=files.filter(function(it){return it.url}).map(function(it){return {name:it.f.name,url:it.url}});
if(imgs.length)um._images=imgs;
var txts=files.filter(function(it){return it.text}).map(function(it){return {name:it.f.name,text:it.text}});
if(txts.length)um._texts=txts;
c.messages.push(um);
if(!c.customTitle){c.title=(text||'New chat').slice(0,42);chatTitle.value=c.title}
touch(c);enterChat();renderAll();scrollBottom();
var retryText=text;var retryFiles=files.slice();
prompt.value='';files=[];renderFiles();
var node=document.createElement('div');node.className='msg ai';
var body=document.createElement('div');body.className='ai-text';
var t=document.createElement('span');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
body.appendChild(t);node.appendChild(body);thread.appendChild(node);scrollBottom();
pending=true;sendBtn.disabled=true;
var mid=store.selectedModel||DEFAULT_MODEL;
var mlbl=modelLabel(mid);
var snapshot=c.messages.slice();
callAI(snapshot,mid).then(function(res){
var am={role:'ai',text:res.text,thought:'Sent '+Math.min(20,snapshot.length)+' message(s) of context to '+mlbl+'.'};
if(res.search)am.search=res.search;
var cc=cur();if(cc&&cc.id===c.id){cc.messages.push(am);touch(cc)}
node.replaceWith(aiNode(am));
}).catch(function(err){
node.remove();
prompt.value=retryText;files=retryFiles;renderFiles();
errorNotice(null,"RateLimited/Retry — please try sending again.");
}).then(function(){pending=false;sendBtn.disabled=false;prompt.focus();scrollBottom()});
});

if(store.activeId&&cur()&&cur().messages.length){renderAll();document.body.classList.add('chat');d.classList.remove('anim');requestAnimationFrame(scrollBottom)}
prompt.focus({preventScroll:true});
})();
