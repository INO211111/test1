<script>
(function(){
var d=document.documentElement;
function off(){d.classList.remove('anim')}
try{var logos=document.querySelectorAll('.logos>*');var last=logos[logos.length-1];if(last){last.addEventListener('animationend',off,{once:true})}}catch(e){}
setTimeout(off,2600);
/* ---- multi-chat store (localStorage) ---- */
var KEY='insovider.chats.v1';
var OLD='insovider.chat.v1';
var store={order:[],chats:{},activeId:null};
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function load(){
try{
var raw=localStorage.getItem(KEY);
if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.order)&&p.chats){store=p;return}}
var o=localStorage.getItem(OLD);
if(o){var s=JSON.parse(o);if(s&&Array.isArray(s.messages)&&s.messages.length){var id=uid();store.chats[id]={id:id,title:s.title||'New chat',customTitle:!!s.customTitle,messages:s.messages,updatedAt:Date.now()};store.order=[id];store.activeId=id;save();try{localStorage.removeItem(OLD)}catch(e){}}}
}catch(e){}
}
function cur(){return store.activeId&&store.chats[store.activeId]?store.chats[store.activeId]:null}
function touch(c){c.updatedAt=Date.now();save();renderList()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var form=document.getElementById('composer');
var prompt=document.getElementById('prompt');
var sendBtn=document.getElementById('sendBtn');
var thread=document.getElementById('thread');
var threadWrap=document.getElementById('threadWrap');
var chatTitle=document.getElementById('chatTitle');
var newChatBtn=document.getElementById('newChat');
var sideNewBtn=document.getElementById('sideNew');
var brandHome=document.getElementById('brandHome');
var side=document.getElementById('side');
var sideList=document.getElementById('sideList');
var sideScrim=document.getElementById('sideScrim');
var histBtn=document.getElementById('histBtn');
function wide(){return window.matchMedia&&window.matchMedia('(min-width:1181px)').matches}
if(wide())document.body.classList.add('side-open');
histBtn.addEventListener('click',function(){document.body.classList.toggle('side-open')});
sideScrim.addEventListener('click',function(){document.body.classList.remove('side-open')});
function fmtDate(ts){try{return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return ''}}
function renderList(){
sideList.innerHTML='';
var items=store.order.map(function(id){return store.chats[id]}).filter(Boolean).sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)});
if(!items.length){var e=document.createElement('p');e.className='side-empty';e.textContent='No recent chats yet. Send a message to start one.';sideList.appendChild(e);return}
items.forEach(function(c){
var row=document.createElement('div');row.className='side-item'+(c.id===store.activeId?' active':'');
var open=document.createElement('button');open.type='button';open.className='side-open';open.title=c.title||'New chat';
var t=document.createElement('span');t.className='side-t';t.textContent=c.title||'New chat';
var dd=document.createElement('span');dd.className='side-d';dd.textContent=fmtDate(c.updatedAt)+' · '+c.messages.length+' msg';
open.appendChild(t);open.appendChild(dd);
open.addEventListener('click',function(){openChat(c.id);if(!wide())document.body.classList.remove('side-open')});
var del=document.createElement('button');del.type='button';del.className='side-del';del.textContent='×';del.setAttribute('aria-label','Delete '+(c.title||'chat'));
del.addEventListener('click',function(ev){ev.stopPropagation();delete store.chats[c.id];store.order=store.order.filter(function(x){return x!==c.id});if(store.activeId===c.id){store.activeId=null;save();renderList();resetView()}else{save();renderList()}});
row.appendChild(open);row.appendChild(del);sideList.appendChild(row);
});
}
function scrollBottom(){threadWrap.scrollTop=threadWrap.scrollHeight}
/* ---- real AI via Cloudflare proxy (key lives server-side, never in this file) ---- */
var AI_ENDPOINT='https://insovider-proxy.gfdgdfghfghghf.workers.dev/';
var pending=false;
function thoughtText(q){return 'Sent context to Sonnet 4.6 and drafted the answer.'}
function toApiMessages(msgs){
var out=[];
msgs.slice(-20).forEach(function(m){
if(m.role==='user'){var t=m.text;if(m.files&&m.files.length)t+='\n[Attached files: '+m.files.join(', ')+']';out.push({role:'user',content:t})}
else if(m.role==='ai'&&m.text){out.push({role:'assistant',content:m.text})}
});
return out;
}
function callAI(msgs){
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},60000);
return fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:toApiMessages(msgs)}),signal:ctrl.signal}).then(function(res){
clearTimeout(to);
if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+(t?' — '+t.slice(0,180):''))});
return res.json();
}).then(function(data){
var ch=data&&data.choices&&data.choices[0];
var txt=ch&&((ch.message&&ch.message.content)||ch.text||'');
txt=String(txt==null?'':txt).trim();
if(!txt)throw new Error('Empty reply from model.');
return txt;
}).catch(function(err){clearTimeout(to);if(err&&err.name==='AbortError')throw new Error('Timed out after 60s.');throw err});
}
function errorNotice(afterNode,msg){
var n=document.createElement('div');n.className='msg sys';
var b=document.createElement('div');b.className='sys-bubble err';b.textContent=msg;
n.appendChild(b);
if(afterNode&&afterNode.parentNode)afterNode.parentNode.insertBefore(n,afterNode.nextSibling);else thread.appendChild(n);
scrollBottom();
}
function aiNode(m){
var wrap=document.createElement('div');wrap.className='msg ai';
var th=document.createElement('button');th.type='button';th.className='thought';th.setAttribute('aria-expanded','false');
th.innerHTML='<svg class="t-ic" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3l2 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span>Thought Process</span><svg class="chev" viewBox="0 0 8 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 1l4 5-4 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var tb=document.createElement('div');tb.className='thought-body';tb.textContent=m.thought||thoughtText(m.text||'');
th.addEventListener('click',function(){var open=th.classList.toggle('open');th.setAttribute('aria-expanded',open?'true':'false')});
var body=document.createElement('div');body.className='ai-text';body.textContent=m.text;
var acts=document.createElement('div');acts.className='msg-actions';
var copy=document.createElement('button');copy.type='button';copy.className='icon-btn';copy.setAttribute('aria-label','Copy response');
var copySvg='<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 3.5v-1h-7v7h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
var okSvg='<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
copy.innerHTML=copySvg;
copy.addEventListener('click',function(){
var done=function(){copy.innerHTML=okSvg;setTimeout(function(){copy.innerHTML=copySvg},1200)};
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(m.text).then(done,done)}else{var ta=document.createElement('textarea');ta.value=m.text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}}catch(e){done()}
});
acts.appendChild(copy);
wrap.appendChild(th);wrap.appendChild(tb);wrap.appendChild(body);wrap.appendChild(acts);
return wrap;
}
function userNode(m){
var wrap=document.createElement('div');wrap.className='msg user';
var col=document.createElement('div');col.className='u-col';
var b=document.createElement('div');b.className='bubble';b.textContent=m.text;
col.appendChild(b);
if(m.files&&m.files.length){var fa=document.createElement('div');fa.className='f-a';m.files.forEach(function(n){var s=document.createElement('span');s.textContent=n;s.title=n;fa.appendChild(s)});col.appendChild(fa)}
wrap.appendChild(col);
return wrap;
}
function renderAll(){var c=cur();thread.innerHTML='';if(!c)return;(c.messages||[]).forEach(function(m){thread.appendChild(m.role==='user'?userNode(m):aiNode(m))});chatTitle.value=c.title||'New chat'}
function enterChat(){if(!document.body.classList.contains('chat'))document.body.classList.add('chat');requestAnimationFrame(scrollBottom)}
function resetView(){thread.innerHTML='';chatTitle.value='New chat';prompt.value='';files=[];renderFiles();document.body.classList.remove('chat');prompt.focus()}
function openChat(id){if(!store.chats[id])return;store.activeId=id;renderAll();renderList();enterChat();prompt.focus()}
var fileInput=document.getElementById('fileInput');
var chipFile=document.getElementById('chipFile');
var filesEl=document.getElementById('files');
var files=[];
function renderFiles(){filesEl.innerHTML='';files.forEach(function(f,i){var pill=document.createElement('span');pill.className='file';var b=document.createElement('b');b.textContent=f.name;b.title=f.name;var x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove '+f.name);x.addEventListener('click',function(){files.splice(i,1);renderFiles()});pill.appendChild(b);pill.appendChild(x);filesEl.appendChild(pill)})}
chipFile.addEventListener('click',function(){fileInput.click()});
fileInput.addEventListener('change',function(){Array.prototype.slice.call(fileInput.files).forEach(function(f){files.push(f)});fileInput.value='';renderFiles();prompt.focus()});
prompt.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();form.requestSubmit()}});
var BLOCKED=/\b(cp|childporn|porn|nigga|nigger)\b/i;
function isBlocked(s){return BLOCKED.test(s||'')}
function blockNotice(){
enterChat();
var n=document.createElement('div');n.className='msg sys';
var b=document.createElement('div');b.className='sys-bubble';b.textContent='That message was blocked. Please try to rephrase the message.';
n.appendChild(b);thread.appendChild(n);scrollBottom();
var card=document.getElementById('composer');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
}
form.addEventListener('submit',function(e){
e.preventDefault();
var text=prompt.value.trim();
if(!text&&!files.length){prompt.focus();return}
if(isBlocked(text)||files.some(function(f){return isBlocked(f.name)})){blockNotice();prompt.focus();return}
var c=cur();
if(!c){var id=uid();c={id:id,title:'New chat',customTitle:false,messages:[],updatedAt:Date.now()};store.chats[id]=c;store.order.push(id);store.activeId=id}
var fns=files.map(function(f){return f.name});
var um={role:'user',text:text||('Sent '+fns.length+' file'+(fns.length>1?'s':''))};if(fns.length)um.files=fns;
c.messages.push(um);
if(!c.customTitle){c.title=(text||'New chat').slice(0,42);chatTitle.value=c.title}
touch(c);enterChat();renderAll();scrollBottom();
prompt.value='';files=[];renderFiles();
var node=document.createElement('div');node.className='msg ai';
var body=document.createElement('div');body.className='ai-text';
var t=document.createElement('span');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
body.appendChild(t);node.appendChild(body);thread.appendChild(node);scrollBottom();
pending=true;sendBtn.disabled=true;
var snapshot=c.messages.slice();
callAI(snapshot).then(function(reply){
var am={role:'ai',text:reply,thought:'Sent '+Math.min(20,snapshot.length)+' message(s) of context to Sonnet 4.6.'};
var cc=cur();if(cc&&cc.id===c.id){cc.messages.push(am);touch(cc)}
node.replaceWith(aiNode(am));
}).catch(function(err){
node.remove();
errorNotice(null,"Couldn't reach Sonnet 4.6: "+err.message);
}).then(function(){pending=false;sendBtn.disabled=false;prompt.focus();scrollBottom()});
});
chatTitle.addEventListener('input',function(){var c=cur();if(!c)return;c.title=chatTitle.value||'New chat';c.customTitle=true;save();renderList()});
chatTitle.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();chatTitle.blur()}});
function newChat(){store.activeId=null;save();renderList();resetView();if(wide())document.body.classList.add('side-open')}
newChatBtn.addEventListener('click',newChat);
sideNewBtn.addEventListener('click',function(){newChat();if(!wide())document.body.classList.remove('side-open')});
brandHome.addEventListener('click',function(){document.body.classList.remove('chat');prompt.focus()});
load();renderList();
if(store.activeId&&cur()&&cur().messages.length){renderAll();document.body.classList.add('chat');d.classList.remove('anim');requestAnimationFrame(scrollBottom)}
prompt.focus({preventScroll:true});
})();
</script>
</body>
</html>
